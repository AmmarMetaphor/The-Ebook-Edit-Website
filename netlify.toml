[build]
  publish = "."

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Internal planning/documentation files are kept in the git repository for
# contributors but must not be served on the live Netlify site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/START-HERE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/THE-EBOOK-EDIT-LAUNCH-GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LAUNCH-CHECKLIST.txt"
  to = "/404.html"
  status = 404
  force = true

# Preferred-URL redirects: send the old .html paths to the extensionless
# canonical URLs so there is exactly one indexable address per page.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
